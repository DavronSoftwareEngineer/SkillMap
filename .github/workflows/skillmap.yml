name: SkillMap quality gate

on:
  pull_request:
    paths-ignore: ["labs/geopulse/**", "labs/telegram-bot/**", "labs/backend-api/**"]
  push:
    branches: [master]
    paths-ignore: ["labs/geopulse/**", "labs/telegram-bot/**", "labs/backend-api/**"]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: skillmap
          POSTGRES_PASSWORD: skillmap_test
          POSTGRES_DB: skillmap_test
        ports: ["54328:5432"]
        options: >-
          --health-cmd "pg_isready -U skillmap -d skillmap_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      SKILLMAP_TEST_DATABASE_URL: postgres://skillmap:skillmap_test@127.0.0.1:54328/skillmap_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx tsc -p tsconfig.server.json
      - run: npx playwright install --with-deps chromium
      - run: npm run test:fullstack
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s labs/learning-foundations -p "test_*.py" -v
      - run: python -m unittest discover -s labs/system-design -p "test_*.py" -v
      - run: python -m unittest discover -s labs/corporate-gis -p "test_*.py" -v
      - run: python -m unittest discover -s labs/market-readiness -p "test_*.py" -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:production
      - run: npm run test:corporate-sdk
      - run: npm run test:e2e
