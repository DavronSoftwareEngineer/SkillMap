# Netlify deploy sozlamasi
[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.openai.com https://api.anthropic.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# SPA — barcha yo'llar index.html'ga (klient routing uchun)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Service worker har doim yangilangan bo'lsin (keshlanmasin)
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
